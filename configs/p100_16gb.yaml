# VLSP 2025 KD Pipeline - P100 16GB Configuration
# This is the default config for running on Tesla P100-PCIE-16GB

project_name: vlsp2025-kd-p100
seed: 42

model:
  teacher_model: Qwen/Qwen3-1.7B
  student_model: Qwen/Qwen3-0.6B
  teacher_quantization: "4bit"
  student_quantization: null
  use_flash_attention: false
  torch_dtype: float16
  max_seq_length: 4096

data:
  vinumqa_train: data/receive/train.json
  vinumqa_valid: data/receive/valid.json
  vinumqa_test: data/receive/test.json
  finqa_dir: data/finqa
  output_dir: data/pipeline
  use_finqa: true
  use_program_re: true
  max_samples: null

teacher:
  use_local: true
  max_workers: 4
  max_retries: 5
  temperature: 0.6
  top_p: 0.95

sft:
  output_dir: checkpoints/sft
  num_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 5.0e-05
  warmup_ratio: 0.1
  weight_decay: 0.01
  lr_scheduler_type: cosine
  use_lora: true
  lora_r: 64
  lora_alpha: 128
  lora_dropout: 0.05
  gradient_checkpointing: true
  bf16: false
  fp16: true
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  save_total_limit: 3

grpo:
  output_dir: checkpoints/grpo
  reward_type: pcpo
  num_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-06
  num_generations: 3
  max_completion_length: 2048
  kl_coef: 0.001
  reward_weights:
    alpha: 0.7
    beta: 0.2
    gamma: 0.1
    valid: 0.20
    execution: 0.25
    program_equiv: 0.25
    step: 0.15
    answer: 0.10
    brevity: 0.05
  use_lora: true
  lora_r: 32
  lora_alpha: 64
  gradient_checkpointing: true
  bf16: false
  fp16: true

inference:
  num_candidates: 5
  temperature: 0.7
  top_p: 0.95
  max_new_tokens: 2048
  use_local: true
  batch_size: 2
